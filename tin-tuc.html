<body>

</div>
</sc-for>
</nav>
<a href="index.html" aria-label="YOKOSHIMA, về trang chủ" class="yk-logo" style="display: inline-flex; align-items: center; min-height: 76px">
<img src="assets/logo-dark.png" alt="YOKOSHIMA" style="height: 34px; display: block">
</a>
<button type="button" class="yk-burger" aria-label="Mở hoặc đóng menu" onclick="document.body.classList.toggle('yk-open')"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 7h20M3 13h20M3 19h20"></path></svg></button>
<nav aria-label="Thương hiệu" class="yk-nav" style="flex: 1 1 300px; display: flex; flex-wrap: wrap; column-gap: 32px; align-items: center; justify-content: flex-end">
<sc-for list="{{ MENU.right }}" as="m" hint-placeholder-count="3">
<div class="yk-mi yk-mr">
<sc-if value="{{ m.isBtn }}"><a href="{{ m.href }}" target="{{ m.target }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; background: var(--yk-o,#f47825); color: var(--yk-k,#231f20); font: 700 14px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; text-decoration: none; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%)">{{ m.label }}</a></sc-if>
<sc-if value="{{ m.isLink }}"><a href="{{ m.href }}" target="{{ m.target }}" aria-current="{{ m.cur }}" style="font: 600 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--yk-k,#231f20); text-decoration: none; min-height: 76px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; border-top: 3px solid transparent; border-bottom: 3px solid {{ m.line }}">{{ m.label }}<svg class="yk-chev" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" style="display: {{ m.chev }}"><path d="M2 4l4 4 4-4"></path></svg></a></sc-if>
<sc-if value="{{ m.hasKids }}"><div class="yk-sub"><sc-for list="{{ m.children }}" as="c" hint-placeholder-count="3"><a href="{{ c.href }}" target="{{ c.target }}" aria-current="{{ c.cur }}">{{ c.label }}</a></sc-for></div></sc-if>
</div>
</sc-for>
<sc-for list="{{ MENU.top }}" as="m" hint-placeholder-count="3"><a class="yk-mtop" href="{{ m.href }}" target="{{ m.target }}">{{ m.label }}</a></sc-for>
</nav>
</div>
</div>
</header><section style="background: var(--yk-k,#231f20); color: #fff; position: relative; overflow: hidden; padding: 64px 5%">
<img src="assets/mark.png" alt="" aria-hidden="true" style="position: absolute; right: -4%; top: -60px; width: 640px; max-width: none; opacity: 0.1">
<div style="position: relative; max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px">
<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--yk-o,#f47825)">Tin tức</div>
<h1 style="margin: 0; font: italic 700 56px/1.05 'Chakra Petch', sans-serif; text-transform: uppercase; text-wrap: balance">Chuyện mới <span style="color: var(--yk-o,#f47825)">từ YOKOSHIMA.</span></h1>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #d6d2d1; max-width: 600px">Khuyến mãi, sự kiện tại cửa hàng và thông tin sản phẩm.</p>
</div>
</section>
<section style="padding: 48px 5% 88px">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ tags }}" as="f" hint-placeholder-count="4">
<button type="button" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}" style="min-height: 44px; padding: 0 20px; border: 1.5px solid var(--yk-k,#231f20); font: 600 14px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; background: {{ f.bg }}; color: {{ f.fg }}">{{ f.label }}</button>
</sc-for>
</div>
<a href="#" style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center; text-decoration: none; color: var(--yk-k,#231f20); background: #f4f3f1">
<div class="ph" style="flex: 3 1 440px; min-height: 380px; background: repeating-linear-gradient(112deg, #e4e1de 0 14px, #ebe9e6 14px 28px)">[ẢNH BÀI NỔI BẬT]</div>
<div style="flex: 2 1 340px; display: flex; flex-direction: column; gap: 14px; padding: 32px">
<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #c2530a">Nổi bật · [NGÀY ĐĂNG]</div>
<h2 style="margin: 0; font: 600 30px/1.3 'Be Vietnam Pro', sans-serif">[Tiêu đề bài viết nổi bật]</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5e5859">[Hai dòng tóm tắt nội dung bài viết.]</p>
<span class="lk" style="align-self: flex-start">Đọc bài</span>
</div>
</a>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 32px 24px">
<sc-for list="{{ posts }}" as="n" hint-placeholder-count="6">
<a href="#" style="display: flex; flex-direction: column; gap: 16px; text-decoration: none; color: var(--yk-k,#231f20)">
<div class="ph" style="aspect-ratio: 16 / 9">[ẢNH BÀI VIẾT]</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #c2530a; font-size: 12px; letter-spacing: 0.12em">{{ n.tag }} · [NGÀY ĐĂNG]</div>
<h3 style="margin: 0; font: 600 20px/1.35 'Be Vietnam Pro', sans-serif">[Tiêu đề bài viết {{ n.no }}]</h3>
</div>
</a>
</sc-for>
</div>
<nav aria-label="Phân trang" style="display: flex; gap: 8px; justify-content: center">
<a href="#" aria-current="page" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: var(--yk-k,#231f20); color: #fff; text-decoration: none; font: 700 15px 'Chakra Petch', sans-serif">1</a>
<a href="#" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--yk-k,#231f20); box-sizing: border-box; text-decoration: none; font: 700 15px 'Chakra Petch', sans-serif">2</a>
<a href="#" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--yk-k,#231f20); box-sizing: border-box; text-decoration: none; font: 700 15px 'Chakra Petch', sans-serif">3</a>
</nav>
</div>
</section>
<footer style="font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: var(--yk-k,#231f20); color: #d6d2d1; padding: 72px 5% 32px">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 40px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px; min-width: 0">
<img src="assets/logo-light.png" alt="YOKOSHIMA" style="display: block; width: 240px; max-width: 100%; height: auto">
<p style="margin: 0; font-size: 15px; line-height: 1.6">{{ S.slogan }}</p>
</div>
<sc-for list="{{ MENU.footer }}" as="m" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; align-items: flex-start">
<h2 style="margin: 0 0 8px; font: 700 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.08em; color: #fff">{{ m.label }}</h2>
<sc-for list="{{ m.children }}" as="c" hint-placeholder-count="4"><a href="{{ c.href }}" target="{{ c.target }}" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center">{{ c.label }}</a></sc-for>
</div></sc-for>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; overflow-wrap: anywhere">
<h2 style="margin: 0 0 8px; font: 700 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.08em; color: #fff">Liên hệ</h2>
<div style="font-size: 15px; line-height: 1.6">{{ S.company }}</div>
<div style="font-size: 15px; line-height: 1.6">MST: {{ S.taxId }}</div>
<div style="font-size: 15px; line-height: 1.6">Đại diện: {{ S.rep }}</div>
<div style="font-size: 15px; line-height: 1.6">Hotline: {{ S.hotline }}</div>
<div style="font-size: 15px; line-height: 1.6">Email: {{ S.email }}</div>
</div>
</div>
<div style="border-top: 1px solid #4a4546; padding-top: 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; font-size: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center"><span>© 2026 YOKOSHIMA</span></div>
<nav aria-label="Mạng xã hội" style="display: flex; flex-wrap: wrap; column-gap: 28px">
<a href="#" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">Facebook</a>
<a href="#" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">TikTok</a>
<a href="https://zalo.me/{{ S.zaloRaw }}" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">Zalo</a>
<a href="#" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">YouTube</a>
</nav>
</div>
</div>
</footer>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { tag: 'Tất cả' }; }
  renderVals() {
    const cur = this.state.tag;
    const all = [['01', 'Khuyến mãi'], ['02', 'Sự kiện'], ['03', 'Sản phẩm'], ['04', 'Khuyến mãi'], ['05', 'Sự kiện'], ['06', 'Sản phẩm']].map(([no, tag]) => ({ no, tag }));
    const tags = ['Tất cả', 'Khuyến mãi', 'Sự kiện', 'Sản phẩm'].map((label) => ({
      label, on: cur === label, bg: cur === label ? '#231f20' : '#ffffff', fg: cur === label ? '#ffffff' : '#231f20',
      pick: () => this.setState({ tag: label })
    }));
    return { tags, posts: cur === 'Tất cả' ? all : all.filter((n) => n.tag === cur) };
  }
}
</script>
<script src="assets/dc.js"></script>
</body>
</html>
