<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hệ thống cửa hàng · YOKOSHIMA</title>
<meta name="description" content="YOKOSHIMA: xe điện cho học sinh, sinh viên. Mang cách sản xuất của người Nhật đến người Việt, với giá của người Việt.">
<link rel="icon" href="assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="app"></div>
<a class="yk-fab" href="lai-thu.html" aria-label="Đăng ký lái thử"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="21" r="3.5"></circle><circle cx="23" cy="21" r="3.5"></circle><path d="M10.5 21h9M19 21l-3-11h-4M16 10h4l3 7M9 14h5"></path></svg></a>
<template id="dc-template">
<div style="background: #fff">
<header class="yk-header" style="font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: var(--yk-k,#231f20); background: #fff; border-bottom: 1px solid #e4e1de">
<div class="yk-top" style="background: var(--yk-k,#231f20); padding: 0 5%">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-wrap: wrap; column-gap: 28px; align-items: center; justify-content: space-between">
<nav aria-label="Liên kết phụ" style="display: flex; flex-wrap: wrap; column-gap: 28px">
<sc-for list="{{ MENU.top }}" as="m" hint-placeholder-count="4"><a href="{{ m.href }}" target="{{ m.target }}" style="font-size: 13px; color: #d6d2d1; text-decoration: none; min-height: 40px; display: inline-flex; align-items: center">{{ m.label }}</a></sc-for>
</nav>
<a href="tel:{{ S.hotlineRaw }}" style="font-size: 13px; color: #d6d2d1; text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; color: #fff; font-weight: 600">Hotline: {{ S.hotline }}</a>
</div>
</div>
<div style="padding: 0 5%">
<div class="yk-bar" style="max-width: 1312px; margin: 0 auto; display: flex; flex-wrap: wrap; column-gap: 32px; align-items: center; justify-content: space-between">
<nav aria-label="Sản phẩm" class="yk-nav" style="flex: 1 1 300px; display: flex; flex-wrap: wrap; column-gap: 32px">
<sc-for list="{{ MENU.left }}" as="m" hint-placeholder-count="3">
<div class="yk-mi">
<sc-if value="{{ m.isBtn }}"><a href="{{ m.href }}" target="{{ m.target }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; background: var(--yk-o,#f47825); color: var(--yk-k,#231f20); font: 700 14px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; text-decoration: none; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%)">{{ m.label }}</a></sc-if>
<sc-if value="{{ m.isLink }}"><a href="{{ m.href }}" target="{{ m.target }}" aria-current="{{ m.cur }}" style="font: 600 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--yk-k,#231f20); text-decoration: none; min-height: 76px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; border-top: 3px solid transparent; border-bottom: 3px solid {{ m.line }}">{{ m.label }}<svg class="yk-chev" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" style="display: {{ m.chev }}"><path d="M2 4l4 4 4-4"></path></svg></a></sc-if>
<sc-if value="{{ m.hasKids }}"><div class="yk-sub"><sc-for list="{{ m.children }}" as="c" hint-placeholder-count="3"><a href="{{ c.href }}" target="{{ c.target }}" aria-current="{{ c.cur }}">{{ c.label }}</a></sc-for></div></sc-if>
</div>
</sc-for>
</nav>
<a href="index.html" aria-label="YOKOSHIMA, về trang chủ" class="yk-logo" style="display: inline-flex; align-items: center; min-height: 76px">
<img src="assets/logo-dark.png" alt="YOKOSHIMA" style="height: 34px; display: block">
</a>
<button type="button" class="yk-burger" aria-label="Mở hoặc đóng menu" onclick="document.body.classList.toggle('yk-open')"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 7h20M3 13h20M3 19h20"></path></svg></button>
<nav aria-label="Thương hiệu" class="yk-nav" style="flex: 1 1 300px; display: flex; flex-wrap: wrap; column-gap: 32px; align-items: center; justify-content: flex-end">
<sc-for list="{{ MENU.right }}" as="m" hint-placeholder-count="3">
<div class="yk-mi yk-mr">
<sc-if value="{{ m.isBtn }}"><a href="{{ m.href }}" target="{{ m.target }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; background: var(--yk-o,#f47825); color: var(--yk-k,#231f20); font: 700 14px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; text-decoration: none; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%)">{{ m.label }}</a></sc-if>
<sc-if value="{{ m.isLink }}"><a href="{{ m.href }}" target="{{ m.target }}" aria-current="{{ m.cur }}" style="font: 600 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--yk-k,#231f20); text-decoration: none; min-height: 76px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; border-top: 3px solid transparent; border-bottom: 3px solid {{ m.line }}">{{ m.label }}<svg class="yk-chev" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" style="display: {{ m.chev }}"><path d="M2 4l4 4 4-4"></path></svg></a></sc-if>
<sc-if value="{{ m.hasKids }}"><div class="yk-sub"><sc-for list="{{ m.children }}" as="c" hint-placeholder-count="3"><a href="{{ c.href }}" target="{{ c.target }}" aria-current="{{ c.cur }}">{{ c.label }}</a></sc-for></div></sc-if>
</div>
</sc-for>
<sc-for list="{{ MENU.top }}" as="m" hint-placeholder-count="3"><a class="yk-mtop" href="{{ m.href }}" target="{{ m.target }}">{{ m.label }}</a></sc-for>
</nav>
</div>
</div>
</header><section style="background: var(--yk-k,#231f20); color: #fff; position: relative; overflow: hidden; padding: 64px 5%">
<img src="assets/mark.png" alt="" aria-hidden="true" style="position: absolute; right: -4%; top: -60px; width: 640px; max-width: none; opacity: 0.1">
<div style="position: relative; max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px">
<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--yk-o,#f47825)">Hệ thống cửa hàng</div>
<h1 style="margin: 0; font: italic 700 56px/1.05 'Chakra Petch', sans-serif; text-transform: uppercase; text-wrap: balance">Tìm YOKOSHIMA <span style="color: var(--yk-o,#f47825)">gần bạn.</span></h1>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #d6d2d1; max-width: 600px">Xem xe, lái thử và bảo dưỡng tại cửa hàng và trung tâm dịch vụ chính hãng.</p>
</div>
</section>
<section style="padding: 48px 5% 88px">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
<form style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 16px; align-items: end; background: #f4f3f1; padding: 24px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Tỉnh / Thành phố<dc-select  style="min-height: 48px; padding: 0 14px; border: 1.5px solid var(--yk-k,#231f20); border-radius: 0; background: #fff; color: var(--yk-k,#231f20); font: 400 16px 'Be Vietnam Pro', sans-serif; box-sizing: border-box; width: 100%"><dc-option>TP. Hồ Chí Minh</dc-option></dc-select></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Quận / Huyện<dc-select  style="min-height: 48px; padding: 0 14px; border: 1.5px solid var(--yk-k,#231f20); border-radius: 0; background: #fff; color: var(--yk-k,#231f20); font: 400 16px 'Be Vietnam Pro', sans-serif; box-sizing: border-box; width: 100%"><dc-option>Chọn quận / huyện</dc-option><dc-option>[QUẬN / HUYỆN]</dc-option></dc-select></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Tìm theo tên hoặc địa chỉ<input type="search"  style="min-height: 48px; padding: 0 14px; border: 1.5px solid var(--yk-k,#231f20); border-radius: 0; background: #fff; color: var(--yk-k,#231f20); font: 400 16px 'Be Vietnam Pro', sans-serif; box-sizing: border-box; width: 100%"></label>
<button type="button" class="btn btn-k">Tìm cửa hàng</button>
</form>
<div style="font-size: 14px; color: #5e5859">{{ count }} cửa hàng tại TP. Hồ Chí Minh</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 20px">
<sc-for list="{{ stores }}" as="st" hint-placeholder-count="9">
<article style="border: 1px solid #e4e1de; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font: 700 20px/1.2 'Chakra Petch', sans-serif; text-transform: uppercase">{{ st.name }}</h3>
<div style="font-size: 15px; line-height: 1.6; color: #5e5859; flex: 1">{{ st.addr }}</div>
<a href="{{ st.tel }}" style="font: 700 18px 'Chakra Petch', sans-serif; min-height: 44px; display: inline-flex; align-items: center; align-self: flex-start; text-decoration: none; border-bottom: 2px solid var(--yk-o,#f47825)">{{ st.phone }}</a>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-top: 6px">
<a href="lai-thu.html" class="btn" style="min-height: 44px; padding: 0 22px; font-size: 13px">Đặt lịch lái thử</a>
<a href="#" class="lk" style="font-size: 14px">Chỉ đường</a>
</div>
</article>
</sc-for>
</div>
<div class="ph" style="min-height: 420px">[BẢN ĐỒ · ghim vị trí 9 cửa hàng]</div>
</div>
</section>
<footer style="font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: var(--yk-k,#231f20); color: #d6d2d1; padding: 72px 5% 32px">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 40px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px; min-width: 0">
<img src="assets/logo-light.png" alt="YOKOSHIMA" style="display: block; width: 240px; max-width: 100%; height: auto">
<p style="margin: 0; font-size: 15px; line-height: 1.6">{{ S.slogan }}</p>
</div>
<sc-for list="{{ MENU.footer }}" as="m" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; align-items: flex-start">
<h2 style="margin: 0 0 8px; font: 700 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.08em; color: #fff">{{ m.label }}</h2>
<sc-for list="{{ m.children }}" as="c" hint-placeholder-count="4"><a href="{{ c.href }}" target="{{ c.target }}" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center">{{ c.label }}</a></sc-for>
</div></sc-for>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; overflow-wrap: anywhere">
<h2 style="margin: 0 0 8px; font: 700 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.08em; color: #fff">Liên hệ</h2>
<div style="font-size: 15px; line-height: 1.6">{{ S.company }}</div>
<div style="font-size: 15px; line-height: 1.6">MST: {{ S.taxId }}</div>
<div style="font-size: 15px; line-height: 1.6">Đại diện: {{ S.rep }}</div>
<div style="font-size: 15px; line-height: 1.6">Hotline: {{ S.hotline }}</div>
<div style="font-size: 15px; line-height: 1.6">Email: {{ S.email }}</div>
</div>
</div>
<div style="border-top: 1px solid #4a4546; padding-top: 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; font-size: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center"><span>© 2026 YOKOSHIMA</span></div>
<nav aria-label="Mạng xã hội" style="display: flex; flex-wrap: wrap; column-gap: 28px">
<a href="#" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">Facebook</a>
<a href="#" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">TikTok</a>
<a href="https://zalo.me/{{ S.zaloRaw }}" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">Zalo</a>
<a href="#" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">YouTube</a>
</nav>
</div>
</div>
</footer>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const stores = window.YK.stores.map((x) => [x.name, x.addr, x.phone]).map(([name, addr, phone]) => ({ name, addr, phone, tel: 'tel:' + phone.replace(/ /g, '') }));
    return { stores, count: stores.length };
  }
}
</script>
<script src="assets/dc.js"></script>
</body>
</html>
