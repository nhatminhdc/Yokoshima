<!doctype html>
<html lang="vi">
<head>

<body>
<div id="app"></div>
<a class="yk-fab" href="lai-thu.html" aria-label="Đăng ký lái thử"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="21" r="3.5"></circle><circle cx="23" cy="21" r="3.5"></circle><path d="M10.5 21h9M19 21l-3-11h-4M16 10h4l3 7M9 14h5"></path></svg></a>
<template id="dc-template">
<div style="background: #fff">
<header class="yk-header" style="font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: var(--yk-k,#231f20); background: #fff; border-bottom: 1px solid #e4e1de">
<div class="yk-top" style="background: var(--yk-k,#231f20); padding: 0 5%">

<sc-for list="{{ MENU.top }}" as="m" hint-placeholder-count="4"><a href="{{ m.href }}" target="{{ m.target }}" style="font-size: 13px; color: #d6d2d1; text-decoration: none; min-height: 40px; display: inline-flex; align-items: center">{{ m.label }}</a></sc-for>
</nav>
<a href="tel:{{ S.hotlineRaw }}" style="font-size: 13px; color: #d6d2d1; text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; color: #fff; font-weight: 600">Hotline: {{ S.hotline }}</a>
</div>
</div>
<div style="padding: 0 5%">
<div class="yk-bar" style="max-width: 1312px; margin: 0 auto; display: flex; flex-wrap: wrap; column-gap: 32px; align-items: center; justify-content: space-between">
<nav aria-label="Sản phẩm" class="yk-nav" style="flex: 1 1 300px; display: flex; flex-wrap: wrap; column-gap: 32px">
<sc-for list="{{ MENU.left }}" as="m" hint-placeholder-count="3">
<div class="yk-mi">
<sc-if value="{{ m.isBtn }}"><a href="{{ m.href }}" target="{{ m.target }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; background: var(--yk-o,#f47825); color: var(--yk-k,#231f20); font: 700 14px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; text-decoration: none; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%)">{{ m.label }}</a></sc-if>
<sc-if value="{{ m.isLink }}"><a href="{{ m.href }}" target="{{ m.target }}" aria-current="{{ m.cur }}" style="font: 600 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--yk-k,#231f20); text-decoration: none; min-height: 76px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; border-top: 3px solid transparent; border-bottom: 3px solid {{ m.line }}">{{ m.label }}<svg class="yk-chev" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" style="display: {{ m.chev }}"><path d="M2 4l4 4 4-4"></path></svg></a></sc-if>
<sc-if value="{{ m.hasKids }}"><div class="yk-sub"><sc-for list="{{ m.children }}" as="c" hint-placeholder-count="3"><a href="{{ c.href }}" target="{{ c.target }}" aria-current="{{ c.cur }}">{{ c.label }}</a></sc-for></div></sc-if>
</div>
</sc-for>
</nav>
<a href="index.html" aria-label="YOKOSHIMA, về trang chủ" class="yk-logo" style="display: inline-flex; align-items: center; min-height: 76px">
<img src="assets/logo-dark.png" alt="YOKOSHIMA" style="height: 34px; display: block">
</a>
<button type="button" class="yk-burger" aria-label="Mở hoặc đóng menu" onclick="document.body.classList.toggle('yk-open')"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 7h20M3 13h20M3 19h20"></path></svg></button>
<nav aria-label="Thương hiệu" class="yk-nav" style="flex: 1 1 300px; display: flex; flex-wrap: wrap; column-gap: 32px; align-items: center; justify-content: flex-end">
<sc-for list="{{ MENU.right }}" as="m" hint-placeholder-count="3">
<div class="yk-mi yk-mr">
<sc-if value="{{ m.isBtn }}"><a href="{{ m.href }}" target="{{ m.target }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; background: var(--yk-o,#f47825); color: var(--yk-k,#231f20); font: 700 14px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; text-decoration: none; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%)">{{ m.label }}</a></sc-if>
<sc-if value="{{ m.isLink }}"><a href="{{ m.href }}" target="{{ m.target }}" aria-current="{{ m.cur }}" style="font: 600 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--yk-k,#231f20); text-decoration: none; min-height: 76px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; border-top: 3px solid transparent; border-bottom: 3px solid {{ m.line }}">{{ m.label }}<svg class="yk-chev" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" style="display: {{ m.chev }}"><path d="M2 4l4 4 4-4"></path></svg></a></sc-if>
<sc-if value="{{ m.hasKids }}"><div class="yk-sub"><sc-for list="{{ m.children }}" as="c" hint-placeholder-count="3"><a href="{{ c.href }}" target="{{ c.target }}" aria-current="{{ c.cur }}">{{ c.label }}</a></sc-for></div></sc-if>
</div>
</sc-for>
<sc-for list="{{ MENU.top }}" as="m" hint-placeholder-count="3"><a class="yk-mtop" href="{{ m.href }}" target="{{ m.target }}">{{ m.label }}</a></sc-for>
</nav>
</div>
</div>
</header>

<nav aria-label="Đường dẫn" style="padding: 0 5%">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 56px; font-size: 14px; color: #5e5859">
<a href="index.html" style="color: #5e5859">Trang chủ</a><span aria-hidden="true">/</span>
<a href="san-pham-tat-ca.html?cat={{ p.cat }}" style="color: #5e5859">{{ catLabel }}</a><span aria-hidden="true">/</span>
<span style="color: var(--yk-k,#231f20); font-weight: 500">{{ p.name }}</span>
</div>
</nav>

<section style="padding: 16px 5% 72px; position: relative; overflow: hidden">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<div style="flex: 2 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 22px; align-items: flex-start">
<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #c2530a">{{ catLabel }}</div>
<h1 style="margin: 0; font: italic 700 64px/1 'Chakra Petch', sans-serif; text-transform: uppercase">{{ p.name }}</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #5e5859">{{ p.desc }}</p>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; color: #5e5859">Giá niêm yết</div>
<div style="font: 700 36px 'Chakra Petch', sans-serif">{{ priceShown }}</div>
</div>
<sc-if value="{{ hasOpts }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px">Phiên bản: <strong>{{ optName }}</strong></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ opts }}" as="o" hint-placeholder-count="2">
<button type="button" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}" style="min-height: 44px; padding: 0 16px; font: 600 14px 'Be Vietnam Pro', sans-serif; cursor: pointer; background: {{ o.bg }}; color: {{ o.fg }}; border: 2px solid var(--yk-k,#231f20)">{{ o.name }}</button>
</sc-for>
</div>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-self: stretch">
<a class="btn" href="https://zalo.me/{{ S.zaloRaw }}" target="_blank" rel="noopener" onClick="{{ buy }}" style="flex: 1 1 180px; min-height: 56px">Mua qua Zalo</a>
<a class="btn btn-k" href="#lai-thu" style="flex: 1 1 180px; min-height: 56px">Đăng ký lái thử</a>
</div>
<sc-if value="{{ copied }}" hint-placeholder-val="{{ false }}">
<div role="status" style="align-self: stretch; background: #fdebdc; padding: 12px 16px; font-size: 14px; line-height: 1.5">Đã sao chép tin nhắn: "{{ buyMsg }}". Dán vào khung chat Zalo rồi gửi.</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr)); gap: 20px; align-self: stretch; margin-top: 12px">
<sc-for list="{{ heroStats }}" as="t" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px; border-left: 3px solid var(--yk-o,#f47825); padding-left: 16px"><div style="font: italic 700 30px/1.1 'Chakra Petch', sans-serif">{{ t.v }}</div><div style="font-size: 14px; color: #5e5859">{{ t.l }}</div></div>
</sc-for>
</div>
</div>
<div style="flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="position: relative; overflow: hidden; background: #f4f3f1; min-height: 480px; display: flex; align-items: center; justify-content: center">
<img src="assets/mark.png" alt="" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 120%; max-width: none; transform: translate(-50%, -50%); opacity: 0.07">
<img src="{{ heroImg }}" alt="{{ heroAlt }}" style="position: relative; max-width: 86%; max-height: 420px; object-fit: contain">
</div>
<sc-if value="{{ hasGallery }}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px">
<sc-for list="{{ shots }}" as="g" hint-placeholder-count="4">
<button type="button" aria-label="{{ g.label }}" aria-pressed="{{ g.on }}" onClick="{{ g.pick }}" style="aspect-ratio: 4 / 3; position: relative; padding: 0; background: #f4f3f1; border: 2px solid {{ g.ring }}; cursor: pointer">
<img src="{{ g.img }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; padding: 8%; object-fit: contain">
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ hasColors }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 15px">Màu sắc: <strong>{{ colorName }}</strong></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px">
<sc-for list="{{ colors }}" as="c" hint-placeholder-count="6">
<button type="button" aria-label="{{ c.label }}" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}" style="aspect-ratio: 4 / 3; position: relative; padding: 0; background: #f4f3f1; border: 2px solid {{ c.ring }}; cursor: pointer">
<img src="{{ c.img }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; padding: 8%; object-fit: contain">
</button>
</sc-for>
</div>
</div>
</sc-if>
</div>
</div>
</section>

<sc-if value="{{ isZH }}" hint-placeholder-val="{{ true }}">
<div>
<section style="background: var(--yk-k,#231f20); color: #fff; padding: 88px 5%">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--yk-o,#f47825)">Thiết kế</div>
<h2 style="margin: 0; font: 700 44px/1.1 'Chakra Petch', sans-serif; text-transform: uppercase">Cổ điển, gọn và chắc</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="border: 1px solid #5e5859; padding: 8px 14px; font-size: 14px">Vành nhôm đúc 14 inch</span>
<span style="border: 1px solid #5e5859; padding: 8px 14px; font-size: 14px">Đèn pha LED bi cầu</span>

</div>
</div>

<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 3L5 9l6 6"></path></svg>
</button>
<div style="flex: 1; min-width: 0; min-height: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #2c2829">

<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: #d6d2d1">{{ angleLabel }} · {{ anglePos }}</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 28px">

</div>
</div>
</section>

<section style="padding: 88px 5%">

<div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div class="ph" style="flex: 3 1 440px; min-height: 340px; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%)">[ẢNH CẬN CẢNH · Đèn pha]</div>
<div style="flex: 2 1 340px; display: flex; flex-direction: column; gap: 14px">
<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #c2530a">Chiếu sáng</div>

</div>
<div style="display: flex; flex-wrap: wrap; flex-direction: row-reverse; gap: 56px; align-items: center">
<div class="ph" style="flex: 3 1 440px; min-height: 340px; clip-path: polygon(0 0, 92% 0, 100% 100%, 8% 100%)">[ẢNH CẬN CẢNH · Khóa NFC và remote]</div>
<div style="flex: 2 1 340px; display: flex; flex-direction: column; gap: 14px">
<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #c2530a">Khóa &amp; chống trộm</div>

<li>Remote tìm xe và báo động.</li>

</ul>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div class="ph" style="flex: 3 1 440px; min-height: 340px; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%)">[ẢNH CẬN CẢNH · Động cơ]</div>
<div style="flex: 2 1 340px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #c2530a">Động cơ</div>

</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px; border-left: 3px solid var(--yk-o,#f47825); padding-left: 16px"><div style="font: italic 700 40px/1 'Chakra Petch', sans-serif">1500 <span style="font-size: 16px; color: #c2530a">W</span></div><div style="font-size: 14px; color: #5e5859">Công suất danh định</div></div><div style="display: flex; flex-direction: column; gap: 6px; border-left: 3px solid var(--yk-o,#f47825); padding-left: 16px"><div style="font: italic 700 40px/1 'Chakra Petch', sans-serif">2450 <span style="font-size: 16px; color: #c2530a">W</span></div><div style="font-size: 14px; color: #5e5859">Công suất tối đa</div></div><div style="display: flex; flex-direction: column; gap: 6px; border-left: 3px solid var(--yk-o,#f47825); padding-left: 16px"><div style="font: italic 700 40px/1 'Chakra Petch', sans-serif">48 <span style="font-size: 16px; color: #c2530a">km/h</span></div><div style="font-size: 14px; color: #5e5859">Tốc độ tối đa</div></div><div style="display: flex; flex-direction: column; gap: 6px; border-left: 3px solid var(--yk-o,#f47825); padding-left: 16px"><div style="font: italic 700 40px/1 'Chakra Petch', sans-serif">IP67 <span style="font-size: 16px; color: #c2530a"></span></div><div style="font-size: 14px; color: #5e5859">Chống nước</div></div>
</div>

<section style="background: #f4f3f1; padding: 88px 5%">

<script type="text/x-dc" id="dc-logic">
const P = window.YK.products;
const GROUPS = [["Tổng quan", [["price", "Giá niêm yết"], ["warranty", "Bảo hành"]]], ["Vận hành", [["range", "Quãng đường mỗi lần sạc"], ["speed", "Tốc độ tối đa"], ["power", "Công suất động cơ"], ["load", "Tải trọng"]]], ["Pin & sạc", [["battType", "Loại pin / ắc quy"], ["battCap", "Dung lượng"], ["charge", "Thời gian sạc đầy"]]], ["Kích thước", [["dims", "Dài × Rộng × Cao"], ["weight", "Trọng lượng xe"], ["tire", "Cỡ lốp / vành"]]], ["Trang bị", [["brake", "Phanh trước / sau"], ["light", "Đèn chiếu sáng"], ["lock", "Khóa & chống trộm"]]]];
class Component extends DCLogic {
  constructor(p){ super(p);
    let id = 'zh';
    try { id = new URLSearchParams(window.location.search).get('id') || 'zh'; } catch (e) {}
    this.state = { id: P.some((x) => x.id === id) ? id : 'zh', color: 0, angle: 0, sent: false, copied: false };
  }
  renderVals() {
    const p = P.find((x) => x.id === this.state.id);
    const isZH = p.id === 'zh';
    const cur = this.state.color;
    const list = p.colors || [];
    const hasColors = list.length > 0;
    const ci = Math.min(cur, Math.max(0, list.length - 1));
    const sel = [ci, (list[ci] || {}).name || ''];
    const colors = list.map((c, i) => ({ label: 'Màu ' + c.name, hex: c.hex || '#cccccc', img: c.img || p.img, on: i === ci, ring: i === ci ? '#231f20' : '#f4f3f1', pick: () => this.setState({ color: i, shot: 0, copied: false }) }));
    const gal = p.gallery || [];
    const shot = Math.min(this.state.shot || 0, gal.length);
    const baseImg = hasColors ? colors[ci].img : p.img;
    const shots = gal.length ? [baseImg].concat(gal).map((img, i) => ({ img, label: 'Ảnh ' + (i + 1), on: i === shot, ring: i === shot ? '#231f20' : '#f4f3f1', pick: () => this.setState({ shot: i }) })) : [];
    const ol = p.options || [];
    const hasOpts = ol.length > 0;
    const oi = Math.min(this.state.opt || 0, Math.max(0, ol.length - 1));
    const optSel = ol[oi] || {};
    const priceShown = hasOpts && optSel.price ? optSel.price + ' ₫' : p.priceText;
    const opts = ol.map((o, i) => ({ name: o.name, on: i === oi, bg: i === oi ? '#231f20' : '#ffffff', fg: i === oi ? '#ffffff' : '#231f20', pick: () => this.setState({ opt: i, copied: false }) }));
    const angles = [['Nghiêng 3/4', 'assets/xe-zh.webp'], ['Ngang', 'assets/zh-goc-ngang.webp'], ['Chính diện', 'assets/zh-goc-truoc.webp']];
    const a = this.state.angle;
    const g = (group, rows) => ({ group, rows: rows.map(([k, v]) => ({ k, v })) });
    const buyMsg = 'Tôi muốn mua ' + p.name + (hasOpts ? ' ' + optSel.name : '') + (hasColors ? ' màu ' + sel[1] : '') + '. Nhờ shop tư vấn giúp.';
    const generic = GROUPS.map(([group, rows]) => ({ group, rows: rows.map(([key, k]) => ({ k, v: key === 'price' ? p.priceText : p[key] })).filter((r) => r.v && r.v !== '—') })).filter((x) => x.rows.length);
    return {
      p, isZH, hasColors, hasOpts, opts, optName: optSel.name || '', priceShown, hasGallery: shots.length > 0, shots, buyMsg, copied: this.state.copied,
      catLabel: window.YK.catName(p.cat),
      buy: () => { try { navigator.clipboard.writeText(buyMsg); } catch (e) {} this.setState({ copied: true }); },
      heroImg: shot > 0 ? gal[shot - 1] : baseImg, heroAlt: p.name + (hasColors ? ' màu ' + sel[1] : ''),
      specTitle: p.name + (hasColors ? ' · ' + sel[1] : ''),
      heroStats: [[p.speed, 'Tốc độ tối đa'], [p.range, 'Quãng đường mỗi lần sạc'], [isZH ? 'IP67' : p.charge, isZH ? 'Chuẩn chống nước' : 'Thời gian sạc đầy']].filter((t) => t[0] && t[0] !== '—').map(([v, l]) => ({ v, l })),
      colors, colorName: sel[1],
      angleImg: angles[a][1], angleLabel: angles[a][0], angleAlt: p.name + ', góc ' + angles[a][0], anglePos: (a + 1) + '/' + angles.length,
      prev: () => this.setState({ angle: (a + angles.length - 1) % angles.length }),
      next: () => this.setState({ angle: (a + 1) % angles.length }),
      sent: this.state.sent, open: !this.state.sent,
      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); },
      specs: isZH ? [
        g('Thông số cơ bản', [['Dài × Rộng × Cao', '1900 × 660 × 1120 mm'], ['Khối lượng bản thân', '123 kg'], ['Cỡ lốp', 'Kenda 90/90-14'], ['Vành', 'Nhôm đúc 14 inch'], ['Phanh trước / sau', 'Đĩa / Đĩa, kèm phanh điện']]),
        g('Động cơ', [['Loại động cơ', 'Không chổi than'], ['Công suất danh định', '1500 W'], ['Công suất tối đa', '2450 W'], ['Tốc độ tối đa', '48 km/h'], ['Quãng đường mỗi lần sạc', '90 km']]),
        g('Ắc quy', [['Loại ắc quy', 'Graphene'], ['Dung lượng', '12V-24Ah'], ['Thời gian sạc đầy', '10–12 giờ']]),
        g('Thông số khác', [['Đèn chiếu sáng', 'Pha LED bi cầu, hậu và xi nhan LED'], ['Khóa & chống trộm', 'Khóa cơ, NFC, remote'], ['Chống nước', 'IP67'], ['Màu sắc', '6 màu'], ['Bảo hành', 'Đến 5 năm']])
      ] : generic,
      related: P.filter((x) => x.cat === p.cat && x.id !== p.id).slice(0, 3).map((x) => ({ id: x.id, name: x.name, price: x.priceText, img: x.img }))
    };
  }
}
</script>
<script src="assets/dc.js"></script>
</body>
