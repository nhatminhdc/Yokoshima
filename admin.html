<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Quản trị · YOKOSHIMA</title>
<link rel="icon" href="assets/mark.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font:400 15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;color:#231f20;background:#f4f3f1}
h1,h2,h3{font-family:'Chakra Petch',sans-serif;text-transform:uppercase;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;background:#f47825;color:#231f20;font-weight:600;padding:10px 18px;cursor:pointer;min-height:42px}
.btn:hover{background:#ff8b3d}.btn:disabled{opacity:.5;cursor:default}
.btn.k{background:#231f20;color:#fff}.btn.k:hover{background:#3a3536}
.btn.g{background:#fff;border:1px solid #cfcac5}.btn.g:hover{border-color:#231f20}
.btn.d{background:#fff;border:1px solid #d9b1ab;color:#a32614}.btn.d:hover{background:#fbeeec}
.btn.s{padding:6px 12px;min-height:34px;font-size:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#5a5456}
input[type=text],input[type=password],select,textarea{border:1px solid #cfcac5;background:#fff;padding:9px 11px;width:100%;font-weight:400;color:#231f20;border-radius:0}
input:focus,select:focus,textarea:focus{outline:2px solid #f47825;outline-offset:-1px}
textarea{resize:vertical;min-height:72px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#231f20}
#gate form{background:#fff;padding:36px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
#gate img{height:34px;align-self:flex-start}
.err{color:#a32614;font-size:14px;min-height:20px}
#app{display:none}
.top{position:sticky;top:0;z-index:5;background:#231f20;color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.top img{height:26px}.top .sp{flex:1}.top a{color:#fff;font-size:14px}
#status{font-size:14px;color:#ffb37f}
.tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid #dcd7d2;padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:14px 16px;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;color:#5a5456}
.tabs button.on{color:#231f20;border-color:#f47825}
main{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.card{background:#fff;padding:24px;display:flex;flex-direction:column;gap:16px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.hint{font-size:13px;color:#6b6567;font-weight:400}
.pl{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
.plist{background:#fff;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:120px}
.plist .hd{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff}
.pi{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #f1eeeb;border-left:3px solid transparent}
.pi:hover{background:#faf8f6}.pi.on{border-left-color:#f47825;background:#fff5ec}
.pi img,.pi .no{width:46px;height:46px;object-fit:contain;background:#f4f3f1;flex:none}
.pi b{font-weight:600;font-size:14px;display:block}.pi small{color:#6b6567}
.pi.off b{color:#9a9496;text-decoration:line-through}
.imgbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.imgbox img,.imgbox .no{width:180px;height:140px;object-fit:contain;background:#f4f3f1}
.row{display:grid;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid #f1eeeb}
.row.st{grid-template-columns:1.2fr 2fr 1fr auto}.row.kv{grid-template-columns:1.5fr 1fr auto}.row.fq{grid-template-columns:1fr;justify-items:start}.row.fq label{width:100%}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:15px;font-weight:500;color:#231f20}
.chk input{width:18px;height:18px;accent-color:#f47825}
@media(max-width:860px){.pl{grid-template-columns:1fr}.plist{position:static;max-height:300px}.row.st,.row.kv{grid-template-columns:1fr}}
</style></head><body>
<div id="gate"><form id="gateForm">
<img src="assets/logo-dark.png" alt="YOKOSHIMA" onerror="this.style.display='none'">
<h2 id="gateTitle">Đang tải…</h2><div class="hint" id="gateHint"></div>
<label id="pwL" style="display:none">Mật khẩu<input type="password" id="pw" autocomplete="current-password"></label>
<label id="pw2L" style="display:none">Nhập lại mật khẩu<input type="password" id="pw2" autocomplete="new-password"></label>
<div class="err" id="gateErr" role="alert"></div>
<button class="btn" id="gateBtn" style="display:none">Đăng nhập</button>
</form></div>
<div id="app">
<div class="top"><img src="assets/logo-light.png" alt="YOKOSHIMA" onerror="this.style.display='none'"><b>Quản trị</b><span class="sp"></span><span id="status" role="status"></span>
<a href="index.html" target="_blank" rel="noopener">Xem trang web</a><button class="btn" id="saveBtn">Lưu thay đổi</button><button class="btn g s" id="outBtn">Đăng xuất</button></div>
<nav class="tabs" id="tabs"></nav><main id="view"></main></div>
<script src="assets/admin.js"></script></body></html>
