<body>

</nav>
<a href="tel:{{ S.hotlineRaw }}" style="font-size: 13px; color: #d6d2d1; text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; color: #fff; font-weight: 600">Hotline: {{ S.hotline }}</a>

<div style="padding: 0 5%">

<sc-if value="{{ m.isLink }}"><a href="{{ m.href }}" target="{{ m.target }}" aria-current="{{ m.cur }}" style="font: 600 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--yk-k,#231f20); text-decoration: none; min-height: 76px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; border-top: 3px solid transparent; border-bottom: 3px solid {{ m.line }}">{{ m.label }}<svg class="yk-chev" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" style="display: {{ m.chev }}"><path d="M2 4l4 4 4-4"></path></svg></a></sc-if>

</header><section style="background: var(--yk-k,#231f20); color: #fff; position: relative; overflow: hidden; padding: 64px 5%">
<img src="assets/mark.png" alt="" aria-hidden="true" style="position: absolute; right: -4%; top: -60px; width: 640px; max-width: none; opacity: 0.1">
<div style="position: relative; max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px">
<div style="font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--yk-o,#f47825)">Sản phẩm</div>
<h1 style="margin: 0; font: italic 700 56px/1.05 'Chakra Petch', sans-serif; text-transform: uppercase; text-wrap: balance">Chọn chiếc xe <span style="color: var(--yk-o,#f47825)">hợp với bạn.</span></h1>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #d6d2d1; max-width: 600px">Xe máy điện, xe thời trang, xe 50cc và phụ kiện chính hãng.</p>
</div>
</section>
<section style="padding: 48px 5% 88px">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #e4e1de; padding-bottom: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ cats }}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}" style="min-height: 44px; padding: 0 20px; border: 1.5px solid var(--yk-k,#231f20); font: 600 14px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; background: {{ f.bg }}; color: {{ f.fg }}">{{ f.label }}</button>
</sc-for>
<sc-if value="{{ hasLine }}"><button type="button" onClick="{{ clearLine }}" aria-label="Bỏ lọc dòng {{ lineLabel }}" style="min-height: 44px; padding: 0 16px; border: 1.5px dashed var(--yk-k,#231f20); background: #fff5ec; color: var(--yk-k,#231f20); font: 600 14px 'Be Vietnam Pro', sans-serif; cursor: pointer">Dòng {{ lineLabel }} ✕</button></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end">
<div style="font-size: 14px; color: #5e5859; min-height: 48px; display: flex; align-items: center">{{ count }} sản phẩm</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; min-width: 220px">Sắp xếp
<dc-select value="{{ sort }}" onChange="{{ setSort }}" style="min-height: 48px; padding: 0 14px; border: 1.5px solid var(--yk-k,#231f20); border-radius: 0; background: #fff; color: var(--yk-k,#231f20); font: 400 16px 'Be Vietnam Pro', sans-serif; box-sizing: border-box; width: 100%">
<dc-option value="default">Nổi bật</dc-option>
<dc-option value="asc">Giá thấp đến cao</dc-option>
<dc-option value="desc">Giá cao đến thấp</dc-option>
</dc-select>
</label>
</div>
</div>
<div class="yk-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 24px">
<sc-for list="{{ bikes }}" as="b" hint-placeholder-count="8">
<article class="card" style="display: flex; flex-direction: column; background: #fff; border: 1px solid #e4e1de">
<div style="position: relative">
<sc-if value="{{ b.img }}" hint-placeholder-val="{{ true }}">
<div style="aspect-ratio: 4 / 3; position: relative; background: #f4f3f1"><img src="{{ b.img }}" alt="{{ b.name }}" style="position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; padding: 5%; object-fit: contain"></div>
</sc-if>
<sc-if value="{{ b.noImg }}" hint-placeholder-val="{{ false }}">
<div class="ph" style="aspect-ratio: 4 / 3">[ẢNH XE · tách nền]</div>
</sc-if>
<sc-if value="{{ b.badge }}" hint-placeholder-val="{{ true }}">
<span style="position: absolute; left: 0; top: 16px; background: {{ b.badgeBg }}; color: {{ b.badgeFg }}; font: 700 12px 'Chakra Petch', sans-serif; letter-spacing: 0.1em; padding: 5px 14px 5px 12px; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%)">{{ b.badge }}</span>
</sc-if>
</div>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 12px; flex: 1">
<h3 style="margin: 0; font: 700 22px/1.2 'Chakra Petch', sans-serif; text-transform: uppercase">{{ b.name }}</h3>
<div style="font-size: 13px; line-height: 1.5; color: #5e5859">{{ b.sub }}</div>
<div style="font: 700 20px 'Chakra Petch', sans-serif; margin-top: auto">{{ b.priceText }}</div>
<div style="display: flex; gap: 16px; align-items: center; justify-content: space-between">
<a class="btn" href="san-pham.html?id={{ b.id }}" style="min-height: 44px; padding: 0 22px; font-size: 13px">Xem chi tiết</a>
<a href="so-sanh.html" style="font-size: 14px; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center">+ So sánh</a>
</div>
</div>
</article>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; background: #f4f3f1; padding: 28px 32px">
<div style="font: 700 22px 'Chakra Petch', sans-serif; text-transform: uppercase">Chưa biết chọn mẫu nào?</div>
<a href="so-sanh.html" class="btn btn-k">So sánh các mẫu xe</a>
</div>
</div>
</section>
<section style="background: var(--yk-o,#f47825); color: var(--yk-k,#231f20); padding: 56px 5%">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font: italic 700 40px/1.1 'Chakra Petch', sans-serif; text-transform: uppercase; text-wrap: balance">Lái thử tại cửa hàng gần bạn</h2>
<a href="lai-thu.html" class="btn btn-k" style="min-height: 56px; padding: 0 40px; font-size: 16px">Đăng ký lái thử</a>
</div>
</section><footer style="font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: var(--yk-k,#231f20); color: #d6d2d1; padding: 72px 5% 32px">
<div style="max-width: 1312px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 40px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px; min-width: 0">
<img src="assets/logo-light.png" alt="YOKOSHIMA" style="display: block; width: 240px; max-width: 100%; height: auto">
<p style="margin: 0; font-size: 15px; line-height: 1.6">{{ S.slogan }}</p>
</div>
<sc-for list="{{ MENU.footer }}" as="m" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; align-items: flex-start">
<h2 style="margin: 0 0 8px; font: 700 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.08em; color: #fff">{{ m.label }}</h2>
<sc-for list="{{ m.children }}" as="c" hint-placeholder-count="4"><a href="{{ c.href }}" target="{{ c.target }}" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center">{{ c.label }}</a></sc-for>
</div></sc-for>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; overflow-wrap: anywhere">
<h2 style="margin: 0 0 8px; font: 700 15px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.08em; color: #fff">Liên hệ</h2>
<div style="font-size: 15px; line-height: 1.6">{{ S.company }}</div>
<div style="font-size: 15px; line-height: 1.6">MST: {{ S.taxId }}</div>
<div style="font-size: 15px; line-height: 1.6">Đại diện: {{ S.rep }}</div>
<div style="font-size: 15px; line-height: 1.6">Hotline: {{ S.hotline }}</div>
<div style="font-size: 15px; line-height: 1.6">Email: {{ S.email }}</div>
</div>
</div>
<div style="border-top: 1px solid #4a4546; padding-top: 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; font-size: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center"><span>© 2026 YOKOSHIMA</span></div>
<nav aria-label="Mạng xã hội" style="display: flex; flex-wrap: wrap; column-gap: 28px">
<a href="#" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">Facebook</a>
<a href="#" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">TikTok</a>
<a href="https://zalo.me/{{ S.zaloRaw }}" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">Zalo</a>
<a href="#" style="color: #d6d2d1; text-decoration: none; font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; min-height: 44px">YouTube</a>
</nav>
</div>
</div>
</footer>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
const P = window.YK.products;
class Component extends DCLogic {
  constructor(p){ super(p); const q = new URLSearchParams(location.search); this.state = { cat: q.get('cat') || 'all', line: q.get('line') || '', sort: 'default' }; }
  renderVals() {
    const badge = (b) => ({ ...b, badgeBg: b.badge === 'BÁN CHẠY' ? '#231f20' : '#f47825', badgeFg: b.badge === 'BÁN CHẠY' ? '#ffffff' : '#231f20' });
    const { cat, sort, line } = this.state;
    const num = (b) => b.price ? Number(b.price.replace(/\./g, '')) : null;
    let bikes = P.filter((b) => (cat === 'all' || b.cat === cat) && (!line || b.line === line)).map(badge);
    if (sort !== 'default') bikes = bikes.slice().sort((a, b) => { const x = num(a), y = num(b); if (x === null || y === null) return (x === null) - (y === null); return sort === 'asc' ? x - y : y - x; });
    const cats = [['all', 'Tất cả']].concat(window.YK.categories.map((c) => [c.id, c.name])).map(([id, label]) => ({
      label, on: cat === id, bg: cat === id ? '#231f20' : '#ffffff', fg: cat === id ? '#ffffff' : '#231f20',
      pick: () => { this.setState({ cat: id, line: '' }); try { history.replaceState(null, '', id === 'all' ? 'san-pham-tat-ca.html' : '?cat=' + encodeURIComponent(id)); } catch (e) {} }
    }));
    return { hasLine: !!line, lineLabel: line, clearLine: () => { this.setState({ line: '' }); try { history.replaceState(null, '', cat === 'all' ? 'san-pham-tat-ca.html' : '?cat=' + encodeURIComponent(cat)); } catch (e) {} }, cats, bikes, count: bikes.length, sort, setSort: (e) => this.setState({ sort: e.target.value }) };
  }
}
</script>
<script src="assets/dc.js"></script>
</body>
</html>
