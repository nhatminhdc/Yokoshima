<script type="text/x-dc" id="dc-logic">
const P = window.YK.products;
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { filter: 'all' }; }
  renderVals() {
    const moto = P.filter((b) => b.cat === 'moto');
    const cur = this.state.filter;
    const filters = [['all', 'Tất cả'], ['Vespa', 'Dáng Vespa'], ['Xmen', 'Dáng Xmen'], ['ZH', 'Dáng ZH'], ['Gogo', 'Dáng Gogo']].map(([id, label]) => ({
      label, bg: cur === id ? '#231f20' : '#ffffff', fg: cur === id ? '#ffffff' : '#231f20',
      pick: () => this.setState({ filter: id })
    }));
    return {
      filters,
      bikes: (cur === 'all' ? moto : moto.filter((b) => b.line === cur)).slice(0, window.YK.theme.homeCount),
      ebikes: P.filter((b) => b.cat === 'fashion').slice(0, window.YK.theme.homeCount)
    };
  }
}
</script>
