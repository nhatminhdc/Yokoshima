<script type="text/x-dc" id="dc-logic">
const P = window.YK.products;
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { f: {} }; }
  renderVals() {
    const n = window.YK.theme.homeCount;
    const homeCats = window.YK.categories.filter((c) => c.home !== false).map((c, k) => {
      const all = P.filter((b) => b.cat === c.id);
      const cur = this.state.f[c.id] || 'all';
      const lines = [...new Set(all.map((b) => b.line).filter(Boolean))];
      const filters = c.filters && lines.length > 1 ? [['all', 'Tất cả']].concat(lines.map((l) => [l, l])).map(([id, label]) => ({
        label, bg: cur === id ? 'var(--yk-k,#231f20)' : '#ffffff', fg: cur === id ? '#ffffff' : 'var(--yk-k,#231f20)',
        pick: () => this.setState({ f: Object.assign({}, this.state.f, { [c.id]: id }) })
      })) : [];
      return { id: c.id, name: c.name, anchor: 'dm-' + c.id, bg: k % 2 ? '#f4f3f1' : '#ffffff', hasFilters: filters.length > 0, filters,
        items: (cur === 'all' ? all : all.filter((b) => b.line === cur)).slice(0, n), more: 'san-pham-tat-ca.html?cat=' + encodeURIComponent(c.id) };
    }).filter((c) => c.items.length > 0);
    return { homeCats };
  }
}
