<script type="text/x-dc" id="dc-logic">
const P = window.YK.products;
const GROUPS = [["Tổng quan", [["price", "Giá niêm yết"], ["warranty", "Bảo hành"]]], ["Vận hành", [["range", "Quãng đường mỗi lần sạc"], ["speed", "Tốc độ tối đa"], ["power", "Công suất động cơ"], ["load", "Tải trọng"]]], ["Pin & sạc", [["battType", "Loại pin / ắc quy"], ["battCap", "Dung lượng"], ["charge", "Thời gian sạc đầy"]]], ["Kích thước", [["dims", "Dài × Rộng × Cao"], ["weight", "Trọng lượng xe"], ["tire", "Cỡ lốp / vành"]]], ["Trang bị", [["brake", "Phanh trước / sau"], ["light", "Đèn chiếu sáng"], ["lock", "Khóa & chống trộm"]]]];
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { slots: ['zh', 'veras', ''], diff: false }; }
  setSlot(i, v) { const s = this.state.slots.slice(); s[i] = v; this.setState({ slots: s }); }
  renderVals() {
    const cur = this.state.slots;
    const picked = cur.map((id) => P.find((p) => p.id === id) || null);
    const slots = cur.map((v, i) => ({
      value: v, filled: !!v, empty: !v, img: picked[i] ? picked[i].img : '', noImg: !!picked[i] && !picked[i].img, name: picked[i] ? picked[i].name : '', slotLabel: 'Xe ' + (i + 1),
      removeLabel: 'Bỏ xe ' + (i + 1) + ' khỏi bảng so sánh',
      change: (e) => this.setSlot(i, e.target.value), remove: () => this.setSlot(i, '')
    }));
    const val = (p, key) => key === 'price' ? p.priceText : p[key];
    const groups = GROUPS.map(([group, rows]) => ({
      group,
      rows: rows.map(([key, k]) => {
        const vals = picked.filter(Boolean).map((p) => val(p, key));
        return { k, same: vals.length > 1 && vals.every((v) => v === vals[0]),
          cells: picked.map((p) => ({ v: p ? val(p, key) : '—', fg: p ? '#231f20' : '#8a8485' })) };
      }).filter((r) => !(this.state.diff && r.same))
    })).filter((g) => g.rows.length);
    return { models: P.filter((p) => p.cat !== 'acc'), slots, groups, count: picked.filter(Boolean).length, diff: this.state.diff,
      noDiff: groups.length === 0, toggleDiff: (e) => this.setState({ diff: e.target.checked }) };
  }
}
</script>
