<div style="flex: 2 1 480px; min-width: 0; border-top: 3px solid #231f20">
<details style="border-bottom: 1px solid #e4e1de"><summary style="min-height: 64px; display: flex; align-items: center; cursor: pointer; font-size: 17px; font-weight: 600">Sạc xe thế nào cho đúng cách?</summary><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5e5859; padding: 0 0 20px">Dùng bộ sạc chính hãng đi kèm xe và cắm ở nơi khô ráo, thoáng. Nên sạc khi pin còn khoảng 20 đến 30 phần trăm, rút sạc khi đã đầy và không cắm sạc liên tục qua nhiều ngày. Ắc quy Graphene sạc đầy mất khoảng 7 đến 12 giờ tùy mẫu xe.</p></details><details style="border-bottom: 1px solid #e4e1de"><summary style="min-height: 64px; display: flex; align-items: center; cursor: pointer; font-size: 17px; font-weight: 600">Bao lâu thì nên bảo dưỡng xe một lần?</summary><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5e5859; padding: 0 0 20px">Nên mang xe đến cửa hàng kiểm tra khoảng 3 tháng một lần: phanh, lốp, đèn, ốc vít và ắc quy. Nếu nghe tiếng lạ, phanh kém ăn hoặc xe đi được ngắn hơn hẳn mọi khi, hãy mang xe đến sớm hơn.</p></details><details style="border-bottom: 1px solid #e4e1de"><summary style="min-height: 64px; display: flex; align-items: center; cursor: pointer; font-size: 17px; font-weight: 600">Xe có đi được dưới trời mưa không?</summary><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5e5859; padding: 0 0 20px">Có. Xe đi được dưới mưa và trên đường ướt. Không nên đi qua chỗ ngập sâu quá nửa bánh xe. Sau khi đi mưa, lau khô và để xe ráo nước rồi mới cắm sạc.</p></details><details style="border-bottom: 1px solid #e4e1de"><summary style="min-height: 64px; display: flex; align-items: center; cursor: pointer; font-size: 17px; font-weight: 600">Học sinh có cần bằng lái để đi xe không?</summary><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5e5859; padding: 0 0 20px">Xe máy điện có tốc độ thiết kế không quá 50 km/h và công suất không quá 4 kW thì không cần bằng lái, nhưng người lái phải từ đủ 16 tuổi và đội mũ bảo hiểm. Học sinh dưới 16 tuổi chưa được lái xe máy điện.</p></details><details style="border-bottom: 1px solid #e4e1de"><summary style="min-height: 64px; display: flex; align-items: center; cursor: pointer; font-size: 17px; font-weight: 600">Làm sao để kích hoạt bảo hành?</summary><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5e5859; padding: 0 0 20px">Bảo hành được ghi nhận ngay khi mua xe tại cửa hàng YOKOSHIMA: nhân viên điền thông tin xe và ngày mua vào phiếu bảo hành. Bạn giữ phiếu cùng hóa đơn; khi cần bảo hành, mang xe và phiếu đến cửa hàng hoặc gọi hotline 0933 191 866.</p></details>
